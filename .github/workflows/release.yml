name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing semantic-version release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: reolink-release-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/piphi-io/piphi-network-reolink
  RELEASE_REF: ${{ inputs.release_ref }}

jobs:
  release:
    name: Verify, publish, and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require default-branch dispatch and a version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Dispatch releases from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be an existing semantic-version tag such as v0.1.0." >&2
            exit 1
          fi

      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development dependencies
        run: |
          python -m pip install --disable-pip-version-check pdm
          pdm install -G dev --frozen-lockfile

      - name: Validate tag and synchronized release metadata
        run: pdm run python scripts/check_release.py "${RELEASE_REF}"

      - name: Run release gates
        run: |
          pdm run pytest
          pdm run ruff check src tests scripts/check_release.py
          pdm run python scripts/validate.py
          pdm build

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_REF#v}"
          mkdir -p release
          cp dist/* release/
          tar \
            --exclude='*/__pycache__' \
            --exclude='*/.pytest_cache' \
            -czf "release/piphi-network-reolink-${VERSION}.tar.gz" \
            manifest.json capability-catalog.json schema src Dockerfile pyproject.toml pdm.lock README.md docs examples
          cd release
          sha256sum ./* > SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_REF }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_REF, '-') }}
          labels: |
            org.opencontainers.image.title=PiPhi Network Reolink
            org.opencontainers.image.description=Local Reolink camera and NVR integration for PiPhi Network.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_REF }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          name: Reolink ${{ env.RELEASE_REF }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*

[project]
name = "piphi-network-reolink"
version = "0.1.0"
description = "Local Reolink camera and NVR integration for PiPhi Network."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.0,<1.0.0",
  "reolink-aio>=0.21.17,<0.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"


[project.scripts]
piphi_network_reolink = "piphi_network_reolink.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_reolink"]
